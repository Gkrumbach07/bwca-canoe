<!doctype html>
<html><head><meta charset="utf-8" /><style>
  body { font: 13px -apple-system, Helvetica, sans-serif; width: 260px; margin: 0; padding: 14px; color: #1d2b33; }
  h1 { font-size: 15px; margin: 0 0 10px; }
  label { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .fix { background: #f0f4f6; border-radius: 8px; padding: 8px 10px; font-variant-numeric: tabular-nums; line-height: 1.5; }
  .muted { color: #6b7a84; }
</style></head>
<body>
  <h1>BWCA Canoe GPS</h1>
  <label><input type="checkbox" id="enabled" /> Spoof location in all tabs</label>
  <div class="fix" id="fix">Waiting for the game…</div>
  <p class="muted">Positions come from the game tab. Reload a page after installing so its scripts pick up the override.</p>
  <script src="popup.js"></script>
</body></html>
