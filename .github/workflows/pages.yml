# Builds the app and deploys it to GitHub Pages on every push to main. The map data is not part of this:
# it is uploaded to a bucket with `npm run data:sync` and the app fetches it from the DATA_URL repository
# variable (Settings → Secrets and variables → Actions → Variables). Without that variable the app looks
# for data/ next to itself, which only works when a small bake is committed under public/data.
# See docs/HOSTING.md.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - id: pages
        uses: actions/configure-pages@v5
      - name: Build
        run: npm run build
        env:
          # '/<repo>/' for a project site, '/' for a user site or a custom domain
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
          VITE_DATA_URL: ${{ vars.DATA_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
